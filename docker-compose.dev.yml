# docker-compose.dev.yml
services:
  web:
    volumes: ["./backend:/app"]
    command: python manage.py runserver 0.0.0.0:8000
    environment: { DEBUG: "1" }
  frontend:
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: npm run dev -- --host 0.0.0.0
    environment: { DEBUG: "1" }
